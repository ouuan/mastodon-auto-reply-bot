name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: latest
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.21.0
      - run: pnpm i
      - run: pnpm lint
